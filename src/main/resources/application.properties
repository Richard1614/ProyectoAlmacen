spring.application.name=Austral_Pilot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/austral_almacen?useSSL=false&serverTimezone=America/Lima}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.check-template-location=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
app.evidence.directory=${EVIDENCE_DIRECTORY:./data/evidencias}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrador}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
