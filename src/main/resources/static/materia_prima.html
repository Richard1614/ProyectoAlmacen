<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
	const tokenGuardado = localStorage.getItem("TokenUsiario");
	
	if (!tokenGuardado) {
        alert("No has iniciado sesión.");
        window.location.replace("index.html");
        return;
    }
    const usuario={
    	token: parseInt(tokenGuardado)
    };
    
    fetch("http://localhost:8080/api/usuario/valida", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		const nombre=rolRecibido;
		document.getElementById("mostrarNombre").textContent = nombre;   
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    
    fetch("http://localhost:8080/api/usuario/valida_token", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(token => {
		token_obtenido = parseInt(token);
		token_html=parseInt(tokenGuardado);
		if(token_obtenido==token_html){
			
		}else{
			alert("No has iniciado sesión.");
        	window.location.replace("index.html");
        	return;
		}
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_rol", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		
		if (rolRecibido === "vendedor") {      
			window.location.href = "menu_vendedor.html";      
        } else if (rolRecibido === "logistica") {
        } else if(rolRecibido === "administrador"){
            window.location.href = "administrador.html";
        }else{
        	window.location.href = "index.html"
        }
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    cargarMateriasPrimas();
});

</script>

  <!-- CONTENIDO -->
  <div class="main-content">
      <div class="page-header">
          <h1>Materia Prima</h1>
          <p>Registra y consulta el inventario de materias primas</p>
      </div>

      <div class="row g-4">

          <!-- Formulario -->
          <div class="col-md-4">
              <div class="card-seccion">
                  <div class="card-seccion-header">
                      <i class="bi bi-plus-circle"></i>
                      <h5>Registrar</h5>
                  </div>
                  <div class="card-seccion-body">
                      <form id="formMateriaPrima">
                          <label class="form-label">Nombre</label>
                          <input type="text" id="nombre" class="form-control" placeholder="Ej: Tela drill">

                          <label class="form-label">Unidad de medida</label>
                          <select id="unidad" class="form-select">
                              <option value="">-- Seleccione --</option>
                              <option value="Metro">Metro (m)</option>
                              <option value="Metro cuadrado">Metro cuadrado (m²)</option>
                              <option value="Centímetro">Centímetro (cm)</option>
                              <option value="Kilogramo">Kilogramo (kg)</option>

                              <option value="Unidad">Unidad (und)</option>
                              <option value="Rollo">Rollo</option>

                              <option value="Par">Par</option>
                              <option value="Bolsa">Bolsa</option>
                          </select>

                          <label class="form-label">Stock inicial</label>
                          <input type="number" id="stock" class="form-control" step="0.01" placeholder="0.00">

                          <input type="number" id="precio_unitario" class="form-control" step="0.01" placeholder="0.00">

                                 placeholder="Buscar por código, nombre o unidad..."
                                 oninput="filtrarTabla()">

                          </button>

                                      <th>Unidad</th>
                                      <th>Stock</th>
                                      <th>Stock Mínimo</th>
                                      <th>Precio Unit. (S/.)</th>
                                      <th>Estado</th>
                                  </tr>
                              </thead>
                              <tbody id="tbodyMateriasPrimas">
                                  <tr><td colspan="7" style="text-align:center;color:#999;padding:20px;">Cargando...</td></tr>
                              </tbody>
                          </table>

<script>
let todasLasMaterias = [];
function borrar_token(){
      	localStorage.removeItem("TokenUsiario");
      	window.location.replace("index.html");
}

function registrar_producto(){
	const nombre = document.getElementById("nombre").value;
    const unidad = document.getElementById("unidad").value;
    const precio = parseFloat(document.getElementById("precio_unitario").value);
    const stockMin = parseFloat(document.getElementById("stock_minimo").value);

    if (!nombre) { alert("El nombre es obligatorio."); return; }
    if (!unidad || unidad === "") { alert("Seleccione una unidad de medida."); return; }
    if (isNaN(precio) || precio <= 0) { alert("El precio unitario debe ser mayor a 0."); return; }
    if (isNaN(stockMin) || stockMin <= 0) { alert("El stock mínimo debe ser mayor a 0."); return; }
    
	const materia_prima = {
        op: "I",
        nombreMp: document.getElementById("nombre").value,
        unidadMp: document.getElementById("unidad").value,
        stockMp: parseFloat(document.getElementById("stock").value) || 0.0,
        precioUnitario: parseFloat(document.getElementById("precio_unitario").value) || 0.0,
        stockMinimo: parseFloat(document.getElementById("stock_minimo").value) || 0.0
    };
    
    fetch("http://localhost:8080/api/usuario/registrar_materia_prima",{
		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(materia_prima)
	})
	 .then(() => {
      alert("Materia prima registrada.");
      document.getElementById('formMateriaPrima').reset();
      cargarMateriasPrimas(); // 👈 recarga la tabla
    });
}



  function cargarMateriasPrimas() {
      fetch("http://localhost:8080/api/usuario/materias-primas")
      .then(res => res.json())
      .then(materias => {
          todasLasMaterias = materias;
          renderizarTabla(materias);
      })
      .catch(() => alert("Error al cargar las materias primas."));
  }

  function renderizarTabla(materias) {
      const tbody = document.getElementById('tbodyMateriasPrimas');
      tbody.innerHTML = "";

      if (materias.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No hay materias primas registradas.</td></tr>`;
          return;
      }

      materias.forEach(m => {
          // m viene como objeto con propiedades: idMateriaPrima, nombreMp, unidadMp, stockMp, precioUnitario, stockMinimo
          const stockBajo = m.stockMp <= m.stockMinimo;
          const estadoBadge = stockBajo
              ? `<span class="badge bg-danger">Stock Bajo</span>`
              : `<span class="badge bg-success">OK</span>`;

          const fila = document.createElement('tr');
          if (stockBajo) fila.classList.add('table-warning');
          fila.innerHTML = `
              <td><strong>${m.idMateriaPrima}</strong></td>
              <td>${m.nombreMp}</td>
              <td>${m.unidadMp}</td>
              <td class="text-center">${m.stockMp}</td>
              <td class="text-center">${m.stockMinimo}</td>
              <td class="text-center font-monospace">S/. ${parseFloat(m.precioUnitario).toFixed(2)}</td>
              <td class="text-center">${estadoBadge}</td>`;
          tbody.appendChild(fila);
      });
  }

  function filtrarTabla() {
      const texto = document.getElementById('buscador').value.toLowerCase();
      const filtradas = todasLasMaterias.filter(m =>
          (m.idMateriaPrima + "").toLowerCase().includes(texto) ||
          (m.nombreMp + "").toLowerCase().includes(texto) ||
          (m.unidadMp + "").toLowerCase().includes(texto)
      );
      renderizarTabla(filtradas);
  }
</script>
