<!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keren Mass — Iniciar Sesión</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }

          body {
              min-height: 100vh;
              display: flex;
              font-family: 'Segoe UI', sans-serif;
          }


          .panel-izquierdo {
              width: 55%;
              background-color: #1c1c1c;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding: 60px;
          }

          .panel-izquierdo img {
              width: 220px;
              filter: invert(1); 
          }

          .panel-izquierdo .tagline {
              color: rgba(255,255,255,0.4);
              font-size: 0.9rem;
              letter-spacing: 3px;
              text-transform: uppercase;
              margin-top: 20px;
          }

          .panel-izquierdo .descripcion {
              color: rgba(255,255,255,0.6);
              font-size: 0.95rem;
              text-align: center;
              margin-top: 15px;
              max-width: 320px;
              line-height: 1.7;
          }
          .panel-derecho {
              width: 45%;
              background-color: #f7f7f7;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 60px 50px;
          }

          .form-box {
              width: 100%;
              max-width: 360px;
          }

          .form-box h2 {
              font-size: 1.6rem;
              font-weight: 700;
              color: #1c1c1c;
              margin-bottom: 6px;
          }

          .form-box .subtitulo {
              color: #999;
              font-size: 0.88rem;
              margin-bottom: 35px;
          }

          .form-box label {
              font-size: 0.82rem;
              font-weight: 600;
              color: #555;
              text-transform: uppercase;
              letter-spacing: 0.8px;
              margin-bottom: 6px;
              display: block;
          }

          .form-box input {
              width: 100%;
              padding: 12px 15px;
              border: 1.5px solid #ddd;
              border-radius: 6px;
              font-size: 0.95rem;
              color: #1c1c1c;
              background: #fff;
              outline: none;
              transition: border 0.2s;
              margin-bottom: 20px;
          }

          .form-box input:focus {
              border-color: #1c1c1c;
          }

          .btn-login {
              width: 100%;
              padding: 13px;
              background-color: #1c1c1c;
              color: #fff;
              border: none;
              border-radius: 6px;
              font-size: 0.95rem;
              font-weight: 600;
              letter-spacing: 1px;
              cursor: pointer;
              transition: background 0.2s;
              margin-top: 5px;
          }

          .btn-login:hover {
              background-color: #333;
          }

          .footer-text {
              color: #bbb;
              font-size: 0.75rem;
              text-align: center;
              margin-top: 30px;
          }


          @media (max-width: 768px) {
              .panel-izquierdo { display: none; }
              .panel-derecho { width: 100%; padding: 40px 25px; }
          }
      </style>
  </head>

  <body>


      <div class="panel-izquierdo">
          <img src="img/logo_ec3.png" alt="Keren Mass">
          <div class="tagline">Sistema de Gestión</div>
          <div class="descripcion">
              Administra tu producción, ventas, compras y logística desde un solo lugar.
          </div>
      </div>

 
      <div class="panel-derecho">
          <div class="form-box">

              <h2>Bienvenido</h2>
              <p class="subtitulo">Ingresa tus credenciales para continuar</p>

              <form id="formCliente">
                  <div>
                      <label>Correo electrónico</label>
                      <input type="email" id="email" placeholder="usuario@kerenmas.pek.com">
                  </div>
                  <div>
                      <label>Contraseña</label>
                      <input type="password" id="contra" placeholder="••••••••">
                  </div>
                  <button type="button" class="btn-login" onclick="iniciar()">
                      Iniciar Sesión
                  </button>
              </form>

              <div class="footer-text">© 2026 Keren Mass — Todos los derechos reservados</div>

          </div>
      </div>
<script>
function iniciar(){
	const correo = document.getElementById("email").value.trim();
    const contra = document.getElementById("contra").value;
    if (!correo || !contra) { alert("Ingresa correo y contraseña."); return; }
	const token1=Math.floor(Math.random() * 100000);
	const usuario={
		correo: document.getElementById("email").value,
		contrasena: document.getElementById("contra").value,
		token: token1
	};
	
	fetch("http://localhost:8080/api/usuario/iniciar",{
		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
	.then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Credenciales inválidas");
		}
	})
	.then(rolRecibido => {
        if (rolRecibido === "vendedor") {
        	localStorage.setItem("TokenUsiario", token1);
            window.location.href = "menu_vendedor.html";
        } else if (rolRecibido === "logistica") {
        	localStorage.setItem("TokenUsiario", token1);
            window.location.href = "menu_logistica.html";
        } else if(rolRecibido === "administrador"){
        	localStorage.setItem("TokenUsiario", token1);
            window.location.href = "administrador.html";
        }else{
        	alert("Credenciales incorrectas o usuario desactivado.");
        	window.location.href = "index.html"
        }
    })
	.catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
    });
}
</script>
</body>
</html>
