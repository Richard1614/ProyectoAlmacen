<!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keren Mass — Gestión de Usuarios</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Segoe UI', sans-serif; background-color: #f7f7f7; min-height: 100vh; display: flex; }

          /* SIDEBAR */
          .sidebar {
              width: 260px; min-height: 100vh; background-color: #1c1c1c;
              display: flex; flex-direction: column; position: fixed; top: 0; left: 0;
          }
          .sidebar-logo { padding: 30px 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
          .sidebar-logo img { width: 140px; filter: invert(1); }
          .sidebar-role { color: rgba(255,255,255,0.35); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
          .sidebar-nav { flex: 1; padding: 20px 0; }
          .nav-section { color: rgba(255,255,255,0.25); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 10px 25px
  6px; }
          .sidebar-nav a {
              display: flex; align-items: center; gap: 12px; padding: 11px 25px;
              color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem;
              transition: all 0.2s; border-left: 3px solid transparent;
          }
          .sidebar-nav a:hover { color: #fff; background: rgba(255,255,255,0.06); border-left-color: #fff; }
          .sidebar-nav a.active { color: #fff; background: rgba(255,255,255,0.08); border-left-color: #fff; }
          .sidebar-nav a i { font-size: 1rem; width: 20px; }
          .sidebar-footer { padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.08); }
          .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
          .user-avatar {
              width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15);
              display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.9rem;
          }
          .user-name { color: #fff; font-size: 0.88rem; font-weight: 600; }
          .user-role { color: rgba(255,255,255,0.35); font-size: 0.75rem; }
          .btn-cerrar {
              width: 100%; padding: 9px; background: transparent;
              border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
              color: rgba(255,255,255,0.5); font-size: 0.85rem; cursor: pointer;
              transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
          }
          .btn-cerrar:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.3); }

          /* CONTENIDO */
          .main-content { margin-left: 260px; flex: 1; padding: 40px; }
          .page-header { margin-bottom: 30px; }
          .page-header h1 { font-size: 1.5rem; font-weight: 700; color: #1c1c1c; }
          .page-header p { color: #999; font-size: 0.9rem; margin-top: 4px; }

          /* CARD */
          .card-seccion {
              background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
              overflow: hidden; margin-bottom: 24px;
          }
          .card-seccion-header {
              padding: 16px 24px; border-bottom: 1px solid #e8e8e8;
              display: flex; align-items: center; gap: 10px;
          }
          .card-seccion-header h5 { font-size: 0.95rem; font-weight: 600; color: #1c1c1c; margin: 0; }
          .card-seccion-header i { color: #1c1c1c; font-size: 1rem; }
          .card-seccion-body { padding: 24px; }

          /* FORMULARIO */
          .form-label {
              font-size: 0.78rem; font-weight: 600; color: #555;
              text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; display: block;
          }
          .form-control, .form-select {
              border: 1.5px solid #e0e0e0; border-radius: 6px;
              font-size: 0.9rem; padding: 10px 13px; color: #1c1c1c;
              transition: border 0.2s; width: 100%; margin-bottom: 16px;
          }
          .form-control:focus, .form-select:focus { border-color: #1c1c1c; outline: none; box-shadow: none; }
          .form-control[readonly] { background: #f7f7f7; color: #999; }

          .btn-crear {
              width: 100%; padding: 11px; background: #1c1c1c; color: #fff;
              border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
              cursor: pointer; transition: background 0.2s; letter-spacing: 0.5px;
          }
          .btn-crear:hover { background: #333; }

          /* TABLA */
          .filtros { display: flex; gap: 12px; margin-bottom: 18px; }
          .filtros input, .filtros select {
              border: 1.5px solid #e0e0e0; border-radius: 6px;
              font-size: 0.88rem; padding: 9px 13px; color: #1c1c1c;
              transition: border 0.2s; outline: none;
          }
          .filtros input { flex: 1; }
          .filtros input:focus, .filtros select:focus { border-color: #1c1c1c; }

          table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
          thead th {
              background: #1c1c1c; color: #fff; padding: 11px 14px;
              font-weight: 500; font-size: 0.8rem; letter-spacing: 0.5px; text-align: left;
          }
          tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
          tbody tr:hover { background: #fafafa; }
          tbody td { padding: 11px 14px; color: #333; vertical-align: middle; }
      </style>
  </head>
    <body>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
      const tokenGuardado = localStorage.getItem("TokenUsiario");
	if (!tokenGuardado) {
        alert("No has iniciado sesión.");
        window.location.replace("index.html");
        return;
    }
    const usuario={
    	token: parseInt(tokenGuardado)
    };
    
    fetch("http://localhost:8080/api/usuario/valida", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(nombreRecibido => {
		const nombre=nombreRecibido;
		document.getElementById("mostrarNombre").textContent = nombre;       
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_token", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(token => {
		token_obtenido = parseInt(token);
		token_html=parseInt(tokenGuardado);
		if(token_obtenido==token_html){
			
		}else{
			alert("No has iniciado sesión.");
        	window.location.replace("index.html");
        	return;
		}
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_rol", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		
		if (rolRecibido === "vendedor") {      
			window.location.href = "menu_vendedor.html";      
        } else if (rolRecibido === "logistica") {
        	window.location.href = "menu_logistica.html";
        } else if(rolRecibido === "administrador"){
            
        }else{
        	window.location.href = "index.html"
        }
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
	
	cargarUsuarios();
      
  });
  </script>


  <!-- SIDEBAR -->
  <div class="sidebar">
      <div class="sidebar-logo">
          <img src="img/logo_ec3.png" alt="Keren Mass">
          <div class="sidebar-role">Administrador</div>
      </div>
      <nav class="sidebar-nav">
          <div class="nav-section">Reportes</div>
          <a href="#" onclick="window.location.replace('administrador.html')">
              <i class="bi bi-house"></i> Inicio
          </a>
          <a href="#" onclick="window.location.replace('reporte_ventas.html')">
              <i class="bi bi-receipt"></i> Ventas
          </a>
          <a href="#" onclick="window.location.replace('reporte_compras.html')">
              <i class="bi bi-cart3"></i> Compras
          </a>
          <a href="#" onclick="window.location.replace('reporte_cotizacion.html')">
              <i class="bi bi-file-earmark-text"></i> Cotizaciones
          </a>
          <a href="#" onclick="window.location.replace('reporte_produccion.html')">
              <i class="bi bi-gear"></i> Producción
          </a>
          <div class="nav-section" style="margin-top:10px;">Gestión</div>
          <a href="#" onclick="window.location.replace('gestion_usuarios.html')" class="active">
              <i class="bi bi-people"></i> Usuarios
          </a>
      </nav>
      <div class="sidebar-footer">
          <div class="user-info">
              <div class="user-avatar"><i class="bi bi-person"></i></div>
              <div>
                  <div class="user-name" id="mostrarNombre">—</div>
                  <div class="user-role">Administrador</div>
              </div>
          </div>
          <button class="btn-cerrar" onclick="borrar_token()">
              <i class="bi bi-box-arrow-left"></i> Cerrar sesión
          </button>
      </div>

  <!-- CONTENIDO -->
  <div class="main-content">
      <div class="page-header">
          <h1>Gestión de Usuarios</h1>
          <p>Crea y administra las cuentas de los empleados</p>
      </div>

      <div class="row g-4">

          <!-- Formulario -->
          <div class="col-md-4">
              <div class="card-seccion">
                  <div class="card-seccion-header">
                      <i class="bi bi-person-plus"></i>
                      <h5>Crear Usuario</h5>
                  </div>
                  <div class="card-seccion-body">
                      <label class="form-label">Nombre de usuario</label>
                      <input type="text" id="inpUsuario" class="form-control"
                             placeholder="juan_vendedor" oninput="previsualizarCorreo()">

                      <label class="form-label">Rol</label>
                      <select id="inpRol" class="form-select" onchange="previsualizarCorreo()">
                          <option value="vendedor">Vendedor</option>
                          <option value="logistica">Logística</option>
                      </select>

                      <label class="form-label">Teléfono</label>
                      <input type="text" id="inpTelefono" class="form-control"
                             placeholder="987654321" oninput="previsualizarCorreo()">

                      <label class="form-label">Correo generado</label>
                      <input type="text" id="inpCorreoPreview" class="form-control"
                             readonly placeholder="Se generará aquí...">

                      <label class="form-label">Contraseña</label>
                      <input type="password" id="inpContrasena" class="form-control">

                      <button class="btn-crear" onclick="crearUsuario()">
                          <i class="bi bi-check-circle"></i> Crear Usuario
                      </button>
                  </div>
              </div>
          </div>

          <!-- Tabla -->
          <div class="col-md-8">
              <div class="card-seccion">
                  <div class="card-seccion-header">
                      <i class="bi bi-people"></i>
                      <h5>Usuarios Registrados</h5>
                  </div>
                  <div class="card-seccion-body">
                      <div class="filtros">
                          <input type="text" id="buscador"
                                 placeholder="Buscar por usuario, rol o correo..."
                                 oninput="filtrarTabla()">
                          <select id="filtroRol" onchange="filtrarTabla()">
                              <option value="">Todos los roles</option>
                              <option value="vendedor">Vendedor</option>
                              <option value="logistica">Logística</option>
                          </select>
                      </div>
                      <div style="overflow-x: auto;">
                          <table>
                              <thead>
                                  <tr>
                                      <th>ID</th>
                                      <th>Usuario</th>
                                      <th>Rol</th>
                                      <th>Correo</th>
                                      <th>Teléfono</th>
                                      <th>Estado</th>
                                      <th>Acción</th>
                                  </tr>
                              </thead>
                              <tbody id="tbodyUsuarios">
                                  <tr><td colspan="8" style="text-align:center;color:#999;padding:20px;">Cargando...</td></tr>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>
          </div>

      </div>
  </div>
 <script>
      let todosLosUsuarios = [];

      // Muestra el correo que se va a generar en tiempo real
      function previsualizarCorreo() {
          const usuario  = document.getElementById('inpUsuario').value.trim();
          const rol      = document.getElementById('inpRol').value;
          const telefono = document.getElementById('inpTelefono').value.trim();

          if (usuario && telefono.length >= 3) {
              const tresNum = telefono.substring(0, 3);
              document.getElementById('inpCorreoPreview').value =
                  `${usuario}_${tresNum}_${rol}@kerenmas.pek.com`;
          } else {
              document.getElementById('inpCorreoPreview').value = "";
          }
      }

      function crearUsuario() {
          const usuario    = document.getElementById('inpUsuario').value.trim();
          const rol        = document.getElementById('inpRol').value;
          const telefono   = document.getElementById('inpTelefono').value.trim();
          const contrasena = document.getElementById('inpContrasena').value;

          if (!usuario || !telefono || !contrasena) {
              alert("Usuario, teléfono y contraseña son obligatorios.");
              return;
          }
          if (telefono.length < 3) {
              alert("El teléfono debe tener al menos 3 dígitos.");
              return;
          }

          const payload = { usuario, rol, telefono, contrasena };

          fetch("http://localhost:8080/api/usuario/registrar", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
              if (data.status === "ok") {
                  alert("Usuario creado con éxito.");
                  document.getElementById('inpUsuario').value = "";
                  document.getElementById('inpTelefono').value = "";
                  document.getElementById('inpContrasena').value = "";
                  document.getElementById('inpCorreoPreview').value = "";
                  cargarUsuarios();
              } else {
                  alert("Error: " + data.message);
              }
          })
          .catch(() => alert("Error al crear el usuario."));
      }

      function cargarUsuarios() {
          fetch("http://localhost:8080/api/usuario/listar")
          .then(res => res.json())
          .then(usuarios => {
              todosLosUsuarios = usuarios;
              renderizarTabla(usuarios);
          })
          .catch(() => alert("Error al cargar los usuarios."));
      }

      function renderizarTabla(usuarios) {
      const tbody = document.getElementById('tbodyUsuarios');
      tbody.innerHTML = "";
      if (usuarios.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No se encontraron usuarios.</td></tr>`;
          return;
      }
      usuarios.forEach(u => {
          // u[0]=id, u[1]=usuario, u[2]=rol, u[3]=correo, u[4]=telefono, u[5]=estado
          const rolBadge = u[2] === 'vendedor'
              ? `<span class="badge bg-success">${u[2]}</span>`
              : u[2] === 'logistica'
              ? `<span class="badge bg-info text-dark">${u[2]}</span>`
              : `<span class="badge bg-secondary">${u[2]}</span>`;

          const estadoBadge = u[5] === 'CONTRATADO'
              ? `<span class="badge bg-success">${u[5]}</span>`
              : `<span class="badge bg-danger">${u[5]}</span>`;

          const btnEstado = u[5] === 'CONTRATADO'
              ? `<button class="btn btn-danger btn-sm" onclick="cambiarEstado(${u[0]})">Descontratar</button>`
              : `<button class="btn btn-success btn-sm" onclick="cambiarEstado(${u[0]})">Contratar</button>`;

          const fila = document.createElement('tr');
          fila.innerHTML = `
              <td>${u[0]}</td>
              <td><strong>${u[1]}</strong></td>
              <td>${rolBadge}</td>
              <td>${u[3]}</td>
              <td>${u[4] ?? '-'}</td>
              <td class="text-center">${estadoBadge}</td>
              <td class="text-center">${btnEstado}</td>`;
          tbody.appendChild(fila);
      });
  }
  
  function cambiarEstado(idUsuario) {
      fetch("http://localhost:8080/api/usuario/cambiar-estado", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idUsuario: idUsuario })
      })
      .then(res => res.text())
      .then(nuevoEstado => {
          alert("Usuario " + nuevoEstado + " correctamente.");
          cargarUsuarios();
      })
      .catch(() => alert("Error al cambiar el estado."));
  }

      function filtrarTabla() {
         const texto = document.getElementById('buscador').value.toLowerCase();
      	 const rol   = document.getElementById('filtroRol').value;

      	const filtrados = todosLosUsuarios.filter(u =>
          (rol === "" || u[2] === rol) &&
          (
              (u[1] + "").toLowerCase().includes(texto) ||
              (u[2] + "").toLowerCase().includes(texto) ||
              (u[3] + "").toLowerCase().includes(texto)
          )
      	  );
      	  renderizarTabla(filtrados);
      }

      function borrar_token() {
          localStorage.removeItem("TokenUsiario");
          window.location.replace("index.html");
      }
  </script>
</body>
</html>
