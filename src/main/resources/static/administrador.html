<!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keren Mass — Administrador</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }

          body {
              font-family: 'Segoe UI', sans-serif;
              background-color: #f7f7f7;
              min-height: 100vh;
              display: flex;
          }

          /* SIDEBAR */
          .sidebar {
              width: 260px;
              min-height: 100vh;
              background-color: #1c1c1c;
              display: flex;
              flex-direction: column;
              position: fixed;
              top: 0; left: 0;
          }

          .sidebar-logo {
              padding: 30px 25px 20px;
              border-bottom: 1px solid rgba(255,255,255,0.08);
          }

          .sidebar-logo img {
              width: 140px;
              filter: invert(1);
          }

          .sidebar-role {
              color: rgba(255,255,255,0.35);
              font-size: 0.72rem;
              letter-spacing: 2px;
              text-transform: uppercase;
              margin-top: 6px;
          }

          .sidebar-nav {
              flex: 1;
              padding: 20px 0;
          }

          .nav-section {
              color: rgba(255,255,255,0.25);
              font-size: 0.7rem;
              letter-spacing: 2px;
              text-transform: uppercase;
              padding: 10px 25px 6px;
          }

          .sidebar-nav a {
              display: flex;
              align-items: center;
              gap: 12px;
              padding: 11px 25px;
              color: rgba(255,255,255,0.6);
              text-decoration: none;
              font-size: 0.9rem;
              transition: all 0.2s;
              border-left: 3px solid transparent;
          }

          .sidebar-nav a:hover {
              color: #fff;
              background: rgba(255,255,255,0.06);
              border-left-color: #fff;
          }

          .sidebar-nav a.active {
              color: #fff;
              background: rgba(255,255,255,0.08);
              border-left-color: #fff;
          }

          .sidebar-nav a i {
              font-size: 1rem;
              width: 20px;
          }

          .sidebar-footer {
              padding: 20px 25px;
              border-top: 1px solid rgba(255,255,255,0.08);
          }

          .user-info {
              display: flex;
              align-items: center;
              gap: 12px;
              margin-bottom: 14px;
          }

          .user-avatar {
              width: 36px;
              height: 36px;
              border-radius: 50%;
              background: rgba(255,255,255,0.15);
              display: flex;
              align-items: center;
              justify-content: center;
              color: #fff;
              font-size: 0.9rem;
          }

          .user-name {
              color: #fff;
              font-size: 0.88rem;
              font-weight: 600;
          }

          .user-role {
              color: rgba(255,255,255,0.35);
              font-size: 0.75rem;
          }

          .btn-cerrar {
              width: 100%;
              padding: 9px;
              background: transparent;
              border: 1px solid rgba(255,255,255,0.15);
              border-radius: 6px;
              color: rgba(255,255,255,0.5);
              font-size: 0.85rem;
              cursor: pointer;
              transition: all 0.2s;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
          }

          .btn-cerrar:hover {
              background: rgba(255,255,255,0.08);
              color: #fff;
              border-color: rgba(255,255,255,0.3);
          }

          /* CONTENIDO PRINCIPAL */
          .main-content {
              margin-left: 260px;
              flex: 1;
              padding: 40px;
          }

          .page-header {
              margin-bottom: 35px;
          }

          .page-header h1 {
              font-size: 1.5rem;
              font-weight: 700;
              color: #1c1c1c;
          }

          .page-header p {
              color: #999;
              font-size: 0.9rem;
              margin-top: 4px;
          }

          /* TARJETAS DE ACCESO RÁPIDO */
          .cards-grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
              gap: 20px;
          }

          .acceso-card {
              background: #fff;
              border: 1px solid #e8e8e8;
              border-radius: 8px;
              padding: 28px 24px;
              cursor: pointer;
              transition: all 0.2s;
              text-decoration: none;
              display: block;
          }

          .acceso-card:hover {
              border-color: #1c1c1c;
              box-shadow: 0 4px 20px rgba(0,0,0,0.08);
              transform: translateY(-2px);
          }

          .acceso-card .card-icon {
              width: 44px;
              height: 44px;
              background: #1c1c1c;
              border-radius: 8px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #fff;
              font-size: 1.2rem;
              margin-bottom: 16px;
          }

          .acceso-card .card-title {
              font-size: 0.95rem;
              font-weight: 600;
              color: #1c1c1c;
              margin-bottom: 4px;
          }

          .acceso-card .card-desc {
              font-size: 0.8rem;
              color: #999;
          }
      </style>
  </head>
<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
	const tokenGuardado = localStorage.getItem("TokenUsiario");
	if (!tokenGuardado) {
        alert("No has iniciado sesión.");
        window.location.replace("index.html");
        return;
    }
    const usuario={
    	token: parseInt(tokenGuardado)
    };
    
    fetch("http://localhost:8080/api/usuario/valida", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(nombreRecibido => {
		const nombre=nombreRecibido;
		document.getElementById("mostrarNombre").textContent = nombre;       
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_token", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(token => {
		token_obtenido = parseInt(token);
		token_html=parseInt(tokenGuardado);
		if(token_obtenido==token_html){
			
		}else{
			alert("No has iniciado sesión.");
        	window.location.replace("index.html");
        	return;
		}
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_rol", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		
		if (rolRecibido === "vendedor") {      
			window.location.href = "menu_vendedor.html";      
        } else if (rolRecibido === "logistica") {
        	window.location.href = "menu_logistica.html";
        } else if(rolRecibido === "administrador"){
            
        }else{
        	window.location.href = "index.html"
        }
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
});
</script>
<!-- SIDEBAR -->
  <div class="sidebar">
      <div class="sidebar-logo">
          <img src="img/logo_ec3.png" alt="Keren Mass">
          <div class="sidebar-role">Administrador</div>
      </div>

      <nav class="sidebar-nav">
          <div class="nav-section">Reportes</div>
          <a href="#" onclick="window.location.replace('administrador.html')" class="active">
              <i class="bi bi-house"></i> Inicio
          </a>
          <a href="#" onclick="window.location.replace('reporte_ventas.html')">
              <i class="bi bi-receipt"></i> Ventas
          </a>
          <a href="#" onclick="window.location.replace('reporte_compras.html')">
              <i class="bi bi-cart3"></i> Compras
          </a>
          <a href="#" onclick="window.location.replace('reporte_cotizacion.html')">
              <i class="bi bi-file-earmark-text"></i> Cotizaciones
          </a>
          <a href="#" onclick="window.location.replace('reporte_produccion.html')">
              <i class="bi bi-gear"></i> Producción
          </a>
          <div class="nav-section" style="margin-top:10px;">Gestión</div>
          <a href="#" onclick="window.location.replace('gestion_usuarios.html')">
              <i class="bi bi-people"></i> Usuarios
          </a>
      </nav>

      <div class="sidebar-footer">
          <div class="user-info">
              <div class="user-avatar"><i class="bi bi-person"></i></div>
              <div>
                  <div class="user-name" id="mostrarNombre">—</div>
                  <div class="user-role">Administrador</div>
              </div>
          </div>
          <button class="btn-cerrar" onclick="borrar_token()">
              <i class="bi bi-box-arrow-left"></i> Cerrar sesión
          </button>
      </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-content">
      <div class="page-header">
          <h1>Panel de Administrador</h1>
          <p>Accede a los reportes y gestión del sistema</p>
      </div>

      <div style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: calc(100vh - 160px);
      ">
          <img src="img/logo_ec3.png" alt="Keren Mass" style="
              width: 420px;
              opacity: 0.07;
          ">
      </div>
  </div>
<script>
	function borrar_token(){
      	localStorage.removeItem("TokenUsiario");
      	window.location.replace("index.html");
      }
</script>
</body>
</html>
