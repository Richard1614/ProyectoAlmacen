document.addEventListener("DOMContentLoaded", () => {

<script>
function borrar_token(){
      	localStorage.removeItem("TokenUsiario");
      	window.location.replace("index.html");
}
function guardarProveedor() {
	
    const proveedorData = {
        op: "I",
        idProveedor: "",
        nombreProveedor: document.getElementById("txtNombreProv").value,
        ruc: document.getElementById("txtRuc").value,
        telefono: document.getElementById("txtTelefono").value,
        direccion: document.getElementById("txtDireccion").value,
        correo: document.getElementById("txtCorreo").value
    };
    
    if (!proveedorData.ruc) { alert("El RUC es obligatorio."); return; }
  	if (!proveedorData.correo) { alert("El correo es obligatorio."); return; }

    if (!proveedorData.nombreProveedor) {
        alert("El nombre del proveedor es obligatorio.");
        return;
    }

    console.log("Enviando proveedor:", proveedorData);

   fetch("http://localhost:8080/api/proveedor/guardar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(proveedorData)
  })
  .then(response => response.json())
  .then(data => {
      if (data.status === "ok") {
          alert("¡Proveedor registrado con éxito!");
          document.getElementById("formProveedor").reset();
          cargarProveedores();
      } else {
          alert("Error: " + data.message);
      }
  })
  .catch(error => {
      console.error("Error:", error);
      alert("No se pudo conectar con el servidor.");
  });
}



let todosLosProveedores = [];

  function cargarProveedores() {
      fetch("http://localhost:8080/api/proveedor/listar")
      .then(res => res.json())
      .then(proveedores => {
          todosLosProveedores = proveedores;
          renderizarTabla(proveedores);
      })
      .catch(() => alert("Error al cargar los proveedores."));
  }

  function renderizarTabla(proveedores) {
      const tbody = document.getElementById('tbodyProveedores');
      tbody.innerHTML = "";

      if (proveedores.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No hay proveedores registrados.</td></tr>`;
          return;
      }

      proveedores.forEach(p => {
          // p viene como objeto: idProveedor, nombreProveedor, ruc, telefono, direccion, correo
          const fila = document.createElement('tr');
          fila.innerHTML = `
              <td><strong>${p.idProveedor}</strong></td>
              <td>${p.nombreProveedor}</td>
              <td>${p.ruc ?? '-'}</td>
              <td>${p.telefono ?? '-'}</td>
              <td>${p.direccion ?? '-'}</td>
              <td>${p.correo ?? '-'}</td>`;
          tbody.appendChild(fila);
      });
  }

  function filtrarTabla() {
      const texto = document.getElementById('buscador').value.toLowerCase();
      const filtrados = todosLosProveedores.filter(p =>
          (p.nombreProveedor + "").toLowerCase().includes(texto) ||
          (p.ruc + "").toLowerCase().includes(texto) ||
          (p.correo + "").toLowerCase().includes(texto)
      );
      renderizarTabla(filtrados);
  }
</script>
