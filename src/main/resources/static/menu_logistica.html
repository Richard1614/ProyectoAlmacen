<!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keren Mass — Panel Logística</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Segoe UI', sans-serif; background-color: #f7f7f7; min-height: 100vh; display: flex; }

          .sidebar { width: 260px; min-height: 100vh; background-color: #1c1c1c; display: flex; flex-direction: column; position: fixed; top: 0;
  left: 0; }
          .sidebar-logo { padding: 30px 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
          .sidebar-logo img { width: 140px; filter: invert(1); }
          .sidebar-role { color: rgba(255,255,255,0.35); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
          .sidebar-nav { flex: 1; padding: 20px 0; }
          .nav-section { color: rgba(255,255,255,0.25); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 10px 25px
  6px; }
          .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 11px 25px; color: rgba(255,255,255,0.6); text-decoration:
  none; font-size: 0.9rem; transition: all 0.2s; border-left: 3px solid transparent; }
          .sidebar-nav a:hover { color: #fff; background: rgba(255,255,255,0.06); border-left-color: #fff; }
          .sidebar-nav a.active { color: #fff; background: rgba(255,255,255,0.08); border-left-color: #fff; }
          .sidebar-nav a i { font-size: 1rem; width: 20px; }
          .sidebar-footer { padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.08); }
          .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
          .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center;
  justify-content: center; color: #fff; font-size: 0.9rem; }
          .user-name { color: #fff; font-size: 0.88rem; font-weight: 600; }
          .user-role { color: rgba(255,255,255,0.35); font-size: 0.75rem; }
          .btn-cerrar { width: 100%; padding: 9px; background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color:
  rgba(255,255,255,0.5); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  gap: 8px; }
          .btn-cerrar:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.3); }

          .main-content { margin-left: 260px; flex: 1; padding: 40px; display: flex; align-items: center; justify-content: center; }
          .watermark { opacity: 0.07; width: 420px; }
      </style>
  </head>

<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
	const tokenGuardado = localStorage.getItem("TokenUsiario");
	if (!tokenGuardado) {
        alert("No has iniciado sesión.");
        window.location.replace("index.html");
        return;
    }
    const usuario={
    	token: parseInt(tokenGuardado)
    };
    
    fetch("http://localhost:8080/api/usuario/valida", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		const nombre=rolRecibido;
		document.getElementById("mostrarNombre").textContent = nombre;       
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_token", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(token => {
		token_obtenido = parseInt(token);
		token_html=parseInt(tokenGuardado);
		if(token_obtenido==token_html){
			
		}else{
			alert("No has iniciado sesión.");
        	window.location.replace("index.html");
        	return;
		}
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
    fetch("http://localhost:8080/api/usuario/valida_rol", {
    	method: "POST",
    	headers: {
			"Content-Type": "application/json"
		},
		body: JSON.stringify(usuario)
	})
    .then(response=>{
		if(response.ok) {
			return response.text();
		}else{
			throw new Error("Inicia secion primero");
			window.location.replace("index.html");
		}
	})
	.then(rolRecibido => {
		
		if (rolRecibido === "vendedor") {      
			window.location.href = "menu_vendedor.html";      
        } else if (rolRecibido === "logistica") {
        } else if(rolRecibido === "administrador"){
            window.location.href = "administrador.html";
        }else{
        	window.location.href = "index.html"
        }
    })
    .catch(error => {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor");
        window.location.replace("index.html"); 
    });
    
});
</script>
<!-- SIDEBAR -->
  <div class="sidebar">
      <div class="sidebar-logo">
          <img src="img/logo_ec3.png" alt="Keren Mass">
          <div class="sidebar-role">Logística</div>
      </div>
      <nav class="sidebar-nav">
          <div class="nav-section">Módulos</div>
          <a href="#" onclick="window.location.replace('menu_logistica.html')" class="active">
              <i class="bi bi-house"></i> Inicio
          </a>
          <a href="#" onclick="window.location.replace('materia_prima.html')">
              <i class="bi bi-boxes"></i> Materia Prima
          </a>
          <a href="#" onclick="window.location.replace('producto.html')">
              <i class="bi bi-box-seam"></i> Producto
          </a>
          <a href="#" onclick="window.location.replace('produccion.html')">
              <i class="bi bi-gear"></i> Producción
          </a>
          <a href="#" onclick="window.location.replace('cotizacion.html')">
              <i class="bi bi-file-earmark-text"></i> Cotización
          </a>
          <a href="#" onclick="window.location.replace('proveedores.html')">
              <i class="bi bi-truck"></i> Proveedores
          </a>
          <a href="#" onclick="window.location.replace('compra.html')">
              <i class="bi bi-cart3"></i> Compra
          </a>
      </nav>
      <div class="sidebar-footer">
          <div class="user-info">
              <div class="user-avatar"><i class="bi bi-person"></i></div>
              <div>
                  <div class="user-name" id="mostrarNombre">—</div>
                  <div class="user-role">Logística</div>
              </div>
          </div>
          <button class="btn-cerrar" onclick="borrar_token()">
              <i class="bi bi-box-arrow-left"></i> Cerrar sesión
          </button>
      </div>
  </div>

  <!-- CONTENIDO -->
  <div class="main-content">
      <img src="img/logo_ec3.png" alt="Keren Mass" class="watermark">
  </div>
<script>
	function borrar_token(){
      	localStorage.removeItem("TokenUsiario");
      	window.location.replace("index.html");
      }
</script>
</body>
</html>
